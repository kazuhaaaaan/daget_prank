<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DANA Kaget - Rp 250.000</title>
    <!-- Menggunakan Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi berkedip lambat untuk tombol */
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(0.98); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }
        
        /* Warna biru khas DANA dengan gradien */
        .bg-dana-gradient {
            background: linear-gradient(135deg, #118EEA 0%, #0c72be 100%);
        }
        .text-dana {
            color: #118EEA;
        }
        .bg-dana {
            background-color: #118EEA;
        }
    </style>
</head>
<body class="bg-dana-gradient flex items-center justify-center min-h-screen font-sans overflow-hidden selection:bg-blue-300 relative">

    <!-- Dekorasi Background khas DANA (Lingkaran transparan) -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-72 h-72 bg-white opacity-10 rounded-full"></div>
        <div class="absolute top-1/4 -right-16 w-40 h-40 bg-white opacity-[0.08] rounded-full"></div>
        <div class="absolute -bottom-32 -right-10 w-96 h-96 bg-white opacity-10 rounded-full"></div>
        <div class="absolute bottom-20 left-10 w-20 h-20 bg-white opacity-10 rounded-full"></div>
    </div>

    <!-- Container Utama (Tampilan Amplop) -->
    <div id="main-content" class="w-full max-w-md p-6 flex flex-col items-center text-center transition-all duration-500 relative z-10">
        
        <!-- Header / Logo Text -->
        <div class="mb-12">
            <h1 class="text-white text-3xl font-extrabold tracking-wide drop-shadow-md">DANA <span class="font-light">Kaget</span></h1>
        </div>

        <!-- Card Amplop -->
        <div class="bg-white w-full rounded-[2rem] shadow-2xl p-8 pt-12 relative overflow-visible mt-6">
            
            <!-- Foto Profil Pengirim (Overlapping) -->
            <div class="absolute -top-10 left-1/2 transform -translate-x-1/2">
                <div class="w-20 h-20 bg-white rounded-full p-1 shadow-lg">
                    <img src="https://ui-avatars.com/api/?name=Nouva+Anonim&background=118EEA&color=fff&size=128" alt="Profile" class="w-full h-full rounded-full object-cover">
                </div>
            </div>

            <h2 class="text-gray-500 text-sm font-semibold mb-1">Nouva Ardhana</h2>
            <p class="text-gray-400 text-xs mb-4">Telah membagikan DANA Kaget untukmu!</p>
            
            <h3 class="text-4xl font-bold text-gray-800 mb-2">Rp 250.000</h3>
            <p class="text-dana text-sm font-medium mb-8 bg-blue-50 py-2 px-4 rounded-full inline-block">Semoga kamu beruntung hari ini! 🥳</p>

            <!-- Area QR Code -->
            <div class="bg-gray-50 p-4 rounded-2xl mb-6 inline-block border border-gray-100 shadow-inner cursor-pointer hover:scale-105 transition-transform" onclick="triggerPrank()">
                <!-- QR Code ini digenerate menggunakan API, mengarah langsung ke gambar monyet jika discan -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?auto=format%26fit=crop%26w=800%26q=80" 
                     alt="QR Code DANA Kaget" 
                     class="w-48 h-48 mx-auto rounded-lg pointer-events-none">
            </div>

            <p class="text-gray-500 text-xs mb-6">Scan QR Code di atas menggunakan HP lain<br>atau klik tombol di bawah untuk membuka.</p>

            <!-- Tombol Klaim -->
            <button onclick="triggerPrank()" class="w-full bg-dana text-white font-bold py-4 rounded-2xl text-lg shadow-[0_8px_20px_rgba(17,142,234,0.4)] hover:bg-blue-600 hover:-translate-y-1 transition-all animate-pulse-soft">
                Buka Sekarang
            </button>
        </div>
        
        <div class="mt-8 flex items-center justify-center space-x-2 opacity-80 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
            </svg>
            <span class="text-xs tracking-wide">100% Aman & Terlindungi</span>
        </div>
    </div>

    <!-- Modal Prank (Disembunyikan pada awalnya) -->
    <div id="prank-modal" class="fixed inset-0 bg-black z-50 hidden flex-col items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        
        <!-- Gambar Monyet Senyum dari Unsplash -->
        <img src="https://images.unsplash.com/photo-1540573133985-87b6da6d54a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
             alt="Monyet Senyum" 
             class="w-full max-w-sm rounded-3xl shadow-[0_0_50px_rgba(255,255,255,0.3)] mb-8 transform scale-0 transition-transform duration-500"
             id="monkey-img">
             
        <h1 class="text-white text-5xl font-extrabold mb-4 text-center text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 drop-shadow-lg" id="prank-text">
            YHAAA KENA PRANK! 🐒
        </h1>
        <p class="text-gray-300 text-lg text-center mb-8">Ngapain lu ngarep duit gratis wkwkwk</p>

        <!-- Tombol Tutup (Hanya me-refresh halaman) -->
        <button onclick="location.reload()" class="bg-white text-gray-900 font-bold py-3 px-8 rounded-full shadow-lg hover:bg-gray-200 transition-colors">
            Tutup Malu 🙈
        </button>
    </div>

    <script>
        function triggerPrank() {
            const modal = document.getElementById('prank-modal');
            const mainContent = document.getElementById('main-content');
            const monkeyImg = document.getElementById('monkey-img');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                
                monkeyImg.classList.remove('scale-0');
                monkeyImg.classList.add('scale-100');
                
                mainContent.style.display = 'none';
            }, 50);
        }
    </script>
</body>
</html>
